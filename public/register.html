<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create account · Roll Register</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="container narrow">
    <div class="page-head" style="text-align:center;">
      <div class="eyebrow">Roll Register</div>
      <h1>Create your account</h1>
      <p>Scan student forms, review the fields, export to Excel.</p>
    </div>

    <div class="card auth-card">
      <form id="register-form">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" required autocomplete="name" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="new-password" minlength="8" />
          <div class="hint">At least 8 characters.</div>
        </div>
        <div class="error-text" id="error-text"></div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Create account</button>
      </form>
    </div>

    <div class="auth-switch">Already have an account? <a href="/login.html">Sign in</a></div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const form = document.getElementById('register-form');
    const errorText = document.getElementById('error-text');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorText.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account…';
      try {
        await apiFetch('/api/auth/register', {
          method: 'POST',
          body: {
            name: document.getElementById('name').value.trim(),
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          },
        });
        window.location.href = '/dashboard.html';
      } catch (err) {
        errorText.textContent = err.message;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create account';
      }
    });
  </script>
</body>
</html>
